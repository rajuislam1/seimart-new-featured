<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Sei Mart</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================================
           PRODUCT DETAILS PAGE
        ========================================= */

        .details-image-area {
            position: relative;
            cursor: zoom-in;
        }
        .details-image-area img {
            transition: transform 0.25s ease;
        }
        .details-image-area.zoomed {
            cursor: zoom-out;
            overflow: hidden;
        }
        .details-image-area.zoomed img {
            transform: scale(1.8);
        }
        .stock-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin: 10px 0 14px;
        }
        .stock-badge.in { background: #e9f6ed; color: #3f8c5a; }
        .stock-badge.low { background: #fff5df; color: #d89b20; }
        .stock-badge.out { background: #fdeceb; color: #d9534f; }
        .related-section {
            margin-top: 40px;
        }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .related-card {
            background: #fff;
            border: 1px solid #e3e9e4;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform .2s;
        }
        .related-card:hover { transform: translateY(-3px); }
        .related-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            background: #f5f7f5;
        }
        .related-card div { padding: 10px 12px; }
        .related-card strong { font-size: 14px; display: block; margin-bottom: 4px; }
        .related-card span { color: #3f6f5a; font-weight: 700; }
        .zoom-hint {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,.55);
            color: #fff;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            pointer-events: none;
        }


        .details-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 35px 20px 60px;
        }

        .breadcrumb {
            font-size: 14px;
            color: #777;
            margin-bottom: 25px;
        }

        .breadcrumb a {
            color: #3f6f5a;
            text-decoration: none;
        }

        .product-details-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .details-image-area {
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f8f5;
            border-radius: 14px;
            overflow: hidden;
        }

        .details-image-area img {
            width: 100%;
            height: 500px;
            object-fit: contain;
        }

        .details-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .details-category {
            color: #3f6f5a;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .details-name {
            font-size: 36px;
            line-height: 1.2;
            margin: 0 0 15px;
            color: #222;
        }

        .details-rating {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .details-stars {
            color: #c9a227;
            font-size: 21px;
            letter-spacing: 2px;
        }

        .details-rating-count {
            color: #777;
            font-size: 14px;
        }

        .details-price {
            font-size: 32px;
            font-weight: 800;
            color: #3f6f5a;
            margin-bottom: 8px;
        }

        .details-stock {
            color: #3f6f5a;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .details-description {
            color: #666;
            line-height: 1.7;
            margin-bottom: 22px;
        }

        .details-label {
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
        }

        .color-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .color-btn {
            border: 1px solid #ddd;
            background: #fff;
            padding: 8px 15px;
            border-radius: 7px;
            cursor: pointer;
            transition: 0.2s;
        }

        .color-btn:hover,
        .color-btn.active {
            border-color: #3f6f5a;
            background: #3f6f5a;
            color: #fff;
        }

        .quantity-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .quantity-control {
            display: inline-flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .quantity-control button {
            width: 38px;
            height: 38px;
            border: none;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 18px;
        }

        .quantity-control span {
            width: 45px;
            text-align: center;
            font-weight: 700;
        }

        .details-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .details-actions button {
            min-height: 48px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: 0.2s;
        }

        .add-details-btn {
            background: #3f6f5a;
            color: #fff;
        }

        .add-details-btn:hover {
            background: #315744;
        }

        .buy-details-btn {
            background: #d4a017;
            color: #fff;
        }

        .buy-details-btn:hover {
            background: #b8890f;
        }

        .product-extra {
            background: #fff;
            margin-top: 30px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        .product-extra h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #222;
        }

        .spec-table {
            width: 100%;
            border-collapse: collapse;
        }

        .spec-table td {
            padding: 13px 10px;
            border-bottom: 1px solid #eee;
        }

        .spec-table td:first-child {
            width: 30%;
            font-weight: 700;
            color: #444;
        }

        /* =========================================
           REVIEWS
        ========================================= */

        .reviews-summary {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding: 18px;
            background: #faf9f4;
            border-radius: 12px;
        }

        .review-score {
            font-size: 40px;
            font-weight: 800;
            color: #222;
        }

        .review-stars {
            color: #c9a227;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .review-count {
            color: #777;
            font-size: 14px;
            margin-top: 4px;
        }

        .review-form {
            border: 1px solid #e8e2d2;
            background: #fffdf7;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
        }

        .review-form h3 {
            margin: 0 0 15px;
            color: #222;
        }

        .review-login-note {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .review-login-note a {
            color: #3f6f5a;
            font-weight: 700;
            text-decoration: none;
        }

        .review-star-input {
            display: flex;
            gap: 4px;
            margin-bottom: 15px;
        }

        .review-star-input button {
            border: none;
            background: transparent;
            color: #ccc;
            font-size: 30px;
            cursor: pointer;
            padding: 0 2px;
            transition: 0.15s;
        }

        .review-star-input button.active,
        .review-star-input button:hover {
            color: #c9a227;
        }

        .review-textarea {
            width: 100%;
            min-height: 110px;
            resize: vertical;
            border: 1px solid #ddd;
            border-radius: 9px;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .review-textarea:focus {
            border-color: #3f6f5a;
            box-shadow: 0 0 0 3px rgba(63,111,90,0.08);
        }

        .review-submit {
            margin-top: 12px;
            border: none;
            background: #3f6f5a;
            color: #fff;
            padding: 11px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .review-submit:hover {
            background: #315744;
        }

        .review-item {
            border-top: 1px solid #eeeeee;
            padding: 18px 0;
        }

        .review-user {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .review-date {
            color: #999;
            font-size: 12px;
            margin-left: 8px;
            font-weight: 400;
        }

        .review-text {
            color: #666;
            line-height: 1.6;
            margin-top: 7px;
        }

        .empty-reviews {
            color: #777;
            padding: 15px 0;
        }

        /* =========================================
           RELATED PRODUCTS
        ========================================= */

        .related-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .related-card {
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            cursor: pointer;
            transition: 0.25s;
        }

        .related-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .related-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            background: #f8f8f5;
        }

        .related-info {
            padding: 14px;
        }

        .related-name {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 7px;
        }

        .related-price {
            color: #3f6f5a;
            font-weight: 800;
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 850px) {
            .product-details-card {
                grid-template-columns: 1fr;
            }

            .details-image-area {
                min-height: 350px;
            }

            .details-image-area img {
                height: 350px;
            }

            .related-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .details-page {
                padding-left: 12px;
                padding-right: 12px;
            }

            .product-details-card,
            .product-extra {
                padding: 20px;
            }

            .details-name {
                font-size: 27px;
            }

            .details-actions {
                grid-template-columns: 1fr;
            }

            .related-grid {
                grid-template-columns: 1fr;
            }

            .spec-table td:first-child {
                width: 40%;
            }

            .reviews-summary {
                gap: 12px;
            }

            .review-score {
                font-size: 32px;
            }
        }
    </style>
</head>

    <!-- =========================================
         PRODUCT SCRIPT
    ========================================= -->

    <script src="script.js"></script>
    <script>

        /* =========================================
           PRODUCT DATA
        ========================================= */

        let products = (typeof getProducts === "function") ? getProducts() : [];




        /* =========================================
           CATEGORY NAMES
        ========================================= */

        const categoryNames = {
            electronics: "Electronics",
            mobile: "Mobile Accessories",
            fashion: "Fashion",
            shoes: "Shoes",
            cosmetics: "Cosmetics",
            perfume: "Perfume",
            watches: "Watches",
            home: "Home & Living",
            jewellery: "Jewellery",
            beauty: "Beauty & Personal Care"
        };


        /* =========================================
           CURRENT PRODUCT
        ========================================= */

        const params =
            new URLSearchParams(window.location.search);

        const productId =
            (params.get("id") || params.get("product") || "").trim();

        // Always reload from central store
        products = (typeof getProducts === "function") ? getProducts() : products;

        const product =
            products.find(function(item) {
                return String(item.id) === String(productId);
            }) || null;

        const container =
            document.getElementById("detailsContainer");


        /* =========================================
           REVIEW STORAGE
        ========================================= */

        const REVIEW_STORAGE_KEY =
            "seiMartProductReviews";


        let selectedReviewRating = 0;


        function getAllReviews() {

            try {

                return JSON.parse(
                    localStorage.getItem(REVIEW_STORAGE_KEY)
                ) || {};

            } catch (error) {

                return {};

            }

        }


        function getProductReviews(productId) {

            const allReviews =
                getAllReviews();

            const list = Array.isArray(allReviews[productId]) ? allReviews[productId] : [];
            return list.filter(function(r){ return !r.status || r.status === "approved"; });

        }


        function saveProductReview(productId, review) {

            const allReviews =
                getAllReviews();

            if (!Array.isArray(allReviews[productId])) {
                allReviews[productId] = [];
            }

            review = Object.assign({ status: "pending", createdAt: new Date().toISOString() }, review || {});
            allReviews[productId].push(review);

            localStorage.setItem(
                REVIEW_STORAGE_KEY,
                JSON.stringify(allReviews)
            );

        }


        /* =========================================
           USER NAME
        ========================================= */

        function getLoggedInUserName() {

            try {

                const user =
                    JSON.parse(
                        localStorage.getItem("seiMartUser")
                    ) || {};

                if (user.name) {
                    return user.name;
                }

                if (user.fullName) {
                    return user.fullName;
                }

                if (user.email) {
                    return user.email.split("@")[0];
                }

            } catch (error) {}

            return "Customer";
        }

        function escapeHtml(value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getProductRatingData(product) {
            const customReviews = getProductReviews(product.id);
            const baseRating = Number(product.rating) || 0;
            const baseCount = Number(product.reviews) || 0;
            let ratingTotal = baseRating * baseCount;
            customReviews.forEach(function(review) {
                ratingTotal += Number(review.rating) || 0;
            });
            const totalReviews = baseCount + customReviews.length;
            const average = totalReviews > 0 ? ratingTotal / totalReviews : (baseRating || 4.5);
            return {
                average: Number(average.toFixed(1)),
                totalReviews: totalReviews
            };
        }

        function makeStars(rating) {
            const rounded = Math.round(Number(rating) || 0);
            let stars = "";
            for (let i = 1; i <= 5; i++) {
                stars += i <= rounded ? "★" : "☆";
            }
            return stars;
        }

        function renderProduct(product) {

            const ratingData =
                getProductRatingData(product);

            const categoryName =
                categoryNames[product.category]
                || product.category
                || "General";

            const colors = Array.isArray(product.colors) ? product.colors : [];
            const sizes = Array.isArray(product.sizes) ? product.sizes : [];
            const stock = Number(product.stock) || 0;
            const price = Number(product.price) || 0;
            const discount = Number(product.discount) || 0;
            const finalPrice = discount > 0 ? Math.round(price * (1 - discount / 100)) : price;
            const img = product.image || "image/products/seimart-product1.png";

            const colorButtons = colors.length ? colors.map(function(color, index) {
                return `<button type="button" class="color-btn ${index === 0 ? "active" : ""}" onclick="selectColor(this)">${escapeHtml(color)}</button>`;
            }).join("") : "";

            const sizeButtons = sizes.length ? sizes.map(function(size, index) {
                return `<button type="button" class="size-btn ${index === 0 ? "active" : ""}" onclick="selectSize(this)">${escapeHtml(size)}</button>`;
            }).join("") : "";

            let stockBadge = "";
            if (stock <= 0) stockBadge = `<span class="stock-badge out">Out of Stock</span>`;
            else if (stock <= 10) stockBadge = `<span class="stock-badge low">Only ${stock} left</span>`;
            else stockBadge = `<span class="stock-badge in">In Stock (${stock})</span>`;

            const priceHTML = discount > 0
                ? `<span class="details-price">৳${finalPrice.toLocaleString("en-BD")}</span>
                   <span style="text-decoration:line-through;color:#999;margin-left:10px;font-size:18px;">৳${price.toLocaleString("en-BD")}</span>
                   <span style="color:#d4a017;font-weight:700;margin-left:8px;">-${discount}%</span>`
                : `<span class="details-price">৳${price.toLocaleString("en-BD")}</span>`;

            // Related products
            const related = products.filter(function(p) {
                return String(p.id) !== String(product.id) && p.category === product.category;
            }).slice(0, 4);

            const relatedHTML = related.length ? `
                <div class="related-section">
                    <h2>Related Products</h2>
                    <div class="related-grid">
                        ${related.map(function(r) {
                            return `<a class="related-card" href="product-details.html?id=${encodeURIComponent(r.id)}">
                                <img src="${r.image || img}" alt="">
                                <div>
                                    <strong>${escapeHtml(r.name)}</strong>
                                    <span>৳${Number(r.price||0).toLocaleString("en-BD")}</span>
                                </div>
                            </a>`;
                        }).join("")}
                    </div>
                </div>` : "";

            container.innerHTML = `
                <div class="breadcrumb">
                    <a href="index.html">Home</a> &nbsp;/&nbsp;
                    <a href="products.html">Products</a> &nbsp;/&nbsp;
                    ${escapeHtml(product.name)}
                </div>

                <div class="product-details-card">
                    <div class="details-gallery">
                    <div class="details-image-area" id="productImageZoom" onclick="toggleProductZoom()" title="Click to zoom">
                        <img id="mainProductImage" src="${img}" alt="${escapeHtml(product.name)}">
                        <span class="zoom-hint">Click to zoom</span>
                    </div>
                    <div class="gallery-thumbs" id="galleryThumbs" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
                        ${(function(){
                          var imgs = Array.isArray(product.images) && product.images.length ? product.images.slice() : [img];
                          // cycle extra from product set
                          var cycle = ["image/products/product-1.png","image/products/product-2.png","image/products/product-3.png","image/products/product-4.png","image/products/product-5.png"];
                          while (imgs.length < 3) {
                            var n = cycle[(imgs.length + (product.id||"").length) % cycle.length];
                            if (imgs.indexOf(n) === -1) imgs.push(n); else imgs.push(cycle[(imgs.length*2)%5]);
                          }
                          return imgs.slice(0,4).map(function(src, i){
                            return '<button type="button" class="thumb-btn" onclick="event.stopPropagation(); switchProductImage(\''+src.replace(/'/g,"")+'\', this)" style="border:'+(i===0?'2px solid #3f6f5a':'1px solid #ddd')+';border-radius:8px;padding:0;overflow:hidden;width:64px;height:64px;cursor:pointer;background:#fff;"><img src="'+src+'" style="width:100%;height:100%;object-fit:cover;"></button>';
                          }).join("");
                        })()}
                    </div>
                </div>

                    <div class="details-info">
                        <div class="details-category">${escapeHtml(categoryName)}</div>
                        <h1 class="details-name">${escapeHtml(product.name)}</h1>

                        <div class="details-rating">
                            <span class="details-stars">${makeStars(ratingData.average)}</span>
                            <span>${ratingData.average} (${ratingData.totalReviews} reviews)</span>
                        </div>

                        ${stockBadge}

                        <div class="details-price-row" style="margin:12px 0 18px;">
                            ${priceHTML}
                        </div>

                        <p class="details-description" style="color:#555;line-height:1.6;margin-bottom:18px;">
                            ${escapeHtml(product.description || "Quality product from Sei Mart.")}
                        </p>

                        ${colorButtons ? `<div class="details-option"><strong>Color</strong><div class="option-row">${colorButtons}</div></div>` : ""}
                        ${sizeButtons ? `<div class="details-option"><strong>Size</strong><div class="option-row">${sizeButtons}</div></div>` : ""}

                        <div class="qty-row" style="margin:16px 0;display:flex;align-items:center;gap:10px;">
                            <strong>Qty</strong>
                            <button type="button" onclick="changeQty(-1)" style="width:36px;height:36px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;">−</button>
                            <input type="number" id="detailsQty" value="1" min="1" max="${Math.max(1, stock)}" style="width:60px;text-align:center;padding:8px;border:1px solid #ccc;border-radius:8px;">
                            <button type="button" onclick="changeQty(1)" style="width:36px;height:36px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;">+</button>
                        </div>

                        <div class="details-actions" style="display:flex;flex-wrap:wrap;gap:10px;">
                            <button type="button" class="add-details-btn" onclick="addDetailsToCart()"
                                style="background:#3f6f5a;color:#fff;border:none;padding:14px 22px;border-radius:10px;font-weight:700;cursor:pointer;"
                                ${stock <= 0 ? "disabled" : ""}>
                                🛒 Add to Cart
                            </button>
                            <button type="button" class="buy-details-btn" onclick="buyNow()"
                                style="background:#d4a017;color:#fff;border:none;padding:14px 22px;border-radius:10px;font-weight:700;cursor:pointer;"
                                ${stock <= 0 ? "disabled" : ""}>
                                ⚡ Buy Now
                            </button>
                        </div>
                    </div>
                </div>

                <div class="product-extra" style="margin-top:28px;background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.05);">
                    <h2>Product Information</h2>
                    <table class="spec-table" style="width:100%;margin-top:12px;border-collapse:collapse;">
                        <tr><td style="padding:10px;border-bottom:1px solid #eee;width:40%;">Brand</td><td style="padding:10px;border-bottom:1px solid #eee;">${escapeHtml(product.brand || "Sei Mart")}</td></tr>
                        <tr><td style="padding:10px;border-bottom:1px solid #eee;">Category</td><td style="padding:10px;border-bottom:1px solid #eee;">${escapeHtml(categoryName)}</td></tr>
                        <tr><td style="padding:10px;border-bottom:1px solid #eee;">Warranty</td><td style="padding:10px;border-bottom:1px solid #eee;">${escapeHtml(product.warranty || "7 days replacement")}</td></tr>
                        <tr><td style="padding:10px;border-bottom:1px solid #eee;">Available Stock</td><td style="padding:10px;border-bottom:1px solid #eee;">${stock}</td></tr>
                    </table>
                    <h3 style="margin-top:20px;">Description</h3>
                    <p style="color:#555;line-height:1.7;">${escapeHtml(product.description || "Quality product from Sei Mart.")}</p>
                </div>

                <div class="product-extra" style="margin-top:24px;background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.05);" id="reviewsSection">
                    <h2>Customer Reviews</h2>
                    <div class="reviews-summary" style="margin:12px 0 20px;">
                        <div class="review-score" style="font-size:32px;font-weight:700;color:#3f6f5a;">${ratingData.average}</div>
                        <div class="review-stars">${makeStars(ratingData.average)}</div>
                        <div class="review-count">${ratingData.totalReviews} reviews</div>
                    </div>
                    <div id="reviewsList"></div>
                    <div class="review-form" style="margin-top:20px;border-top:1px solid #eee;padding-top:16px;">
                        <h3>Write a Review</h3>
                        <div class="review-star-input" id="reviewStarInput" style="margin:10px 0;">
                            ${[1,2,3,4,5].map(n => `<button type="button" data-rating="${n}" onclick="setReviewRating(${n})" style="font-size:22px;background:none;border:none;cursor:pointer;color:#ccc;">★</button>`).join("")}
                        </div>
                        <textarea id="reviewText" class="review-textarea" rows="3" placeholder="Share your experience..." style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;"></textarea>
                        <button type="button" class="review-submit" onclick="submitReview()" style="margin-top:10px;background:#3f6f5a;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;">Submit Review</button>
                    </div>
                </div>

                ${relatedHTML}
            `;

            renderReviewsList(product);
            window.__currentProduct = product;
            if (typeof addRecentlyViewed === "function") addRecentlyViewed(product.id);
        }

        function switchProductImage(src, btn) {
            var img = document.getElementById("mainProductImage");
            if (img) img.src = src;
            document.querySelectorAll(".thumb-btn").forEach(function(b){ b.style.border = "1px solid #ddd"; });
            if (btn) btn.style.border = "2px solid #3f6f5a";
        }
        function toggleProductZoom() {
            var el = document.getElementById("productImageZoom");
            if (el) el.classList.toggle("zoomed");
        }

        function changeQty(delta) {
            var input = document.getElementById("detailsQty");
            if (!input) return;
            var max = Number(input.max) || 99;
            var v = Number(input.value) || 1;
            v = Math.min(max, Math.max(1, v + delta));
            input.value = v;
        }

        function selectColor(btn) {
            document.querySelectorAll(".color-btn").forEach(function(b){ b.classList.remove("active"); });
            btn.classList.add("active");
        }

        function selectSize(btn) {
            document.querySelectorAll(".size-btn").forEach(function(b){ b.classList.remove("active"); });
            btn.classList.add("active");
        }

        function setReviewRating(n) {
            selectedReviewRating = n;
            document.querySelectorAll("#reviewStarInput button").forEach(function(b) {
                b.style.color = Number(b.getAttribute("data-rating")) <= n ? "#d4a017" : "#ccc";
                b.classList.toggle("active", Number(b.getAttribute("data-rating")) <= n);
            });
        }

        function renderReviewsList(product) {
            var box = document.getElementById("reviewsList");
            if (!box) return;
            var list = getProductReviews(product.id);
            if (!list.length) {
                box.innerHTML = '<p class="empty-reviews" style="color:#999;">No reviews yet. Be the first!</p>';
                return;
            }
            box.innerHTML = list.slice().reverse().map(function(r) {
                return `<div class="review-item" style="padding:12px 0;border-bottom:1px solid #eee;">
                    <div class="review-user" style="font-weight:700;">${escapeHtml(r.name || "Customer")}</div>
                    <div class="review-date" style="font-size:12px;color:#999;">${escapeHtml(r.date || "")} · ${makeStars(Number(r.rating)||0)}</div>
                    <div class="review-text" style="margin-top:6px;color:#444;">${escapeHtml(r.comment || r.text || "")}</div>
                </div>`;
            }).join("");
        }

        function submitReview() {
            var product = window.__currentProduct;
            if (!product) return;
            if (!selectedReviewRating) { alert("Please select a star rating."); return; }
            var text = ((document.getElementById("reviewText") || {}).value || "").trim();
            if (!text) { alert("Please write a short review."); return; }
            saveProductReview(product.id, {
                name: getLoggedInUserName(),
                rating: selectedReviewRating,
                comment: text,
                date: new Date().toLocaleDateString("en-BD")
            });
            selectedReviewRating = 0;
            var ta = document.getElementById("reviewText");
            if (ta) ta.value = "";
            renderProduct(product);
            alert("Thank you for your review!");
        }

        function addDetailsToCart() {
            var product = window.__currentProduct;
            if (!product) return;
            if ((Number(product.stock)||0) <= 0) { alert("Out of stock"); return; }
            var qty = Number((document.getElementById("detailsQty") || {}).value) || 1;
            var cart = [];
            try { cart = JSON.parse(localStorage.getItem("cart") || "[]"); } catch(e) {}
            if (!Array.isArray(cart)) cart = [];
            var idx = cart.findIndex(function(i){ return String(i.id) === String(product.id); });
            if (idx >= 0) cart[idx].quantity = (Number(cart[idx].quantity)||1) + qty;
            else {
                var colorBtn = document.querySelector(".color-btn.active");
                var sizeBtn = document.querySelector(".size-btn.active");
                var variant = [];
                if (colorBtn) variant.push(colorBtn.textContent.trim());
                if (sizeBtn) variant.push(sizeBtn.textContent.trim());
                cart.push({
                    id: product.id,
                    name: product.name + (variant.length ? (" (" + variant.join(" / ") + ")") : ""),
                    price: product.price,
                    image: product.image,
                    quantity: qty,
                    color: colorBtn ? colorBtn.textContent.trim() : "",
                    size: sizeBtn ? sizeBtn.textContent.trim() : ""
                });
            }
            localStorage.setItem("cart", JSON.stringify(cart));
            try { sessionStorage.setItem("seiMartCartAddedByCustomer", "1"); } catch(e) {}
            alert("Added to cart!");
        }

        function buyNow() {
            addDetailsToCart();
            window.location.href = "checkout.html";
        }



        /* =========================================
           INITIALIZE
        ========================================= */

        if (!container) {
            console.error("detailsContainer missing");
        } else if (!productId || !product) {

            container.innerHTML = `

                <div
                    style="
                        text-align:center;
                        padding:80px 20px;
                    "
                >

                    <h2>
                        Product Not Found
                    </h2>

                    <p>
                        The product you are looking for
                        does not exist.
                        ${productId ? ("(ID: " + productId.replace(/</g,"") + ")") : ""}
                    </p>

                    <a
                        href="products.html"
                        style="
                            color:#3f6f5a;
                            font-weight:700;
                        "
                    >
                        ← Back to Products
                    </a>

                </div>

            `;

        } else {
            try {
                renderProduct(product);
            } catch (err) {
                console.error(err);
                container.innerHTML = "<div style='padding:40px;text-align:center'><h2>Could not load product</h2><p>" + String(err.message || err) + "</p><a href='products.html'>Back</a></div>";
            }
        }

    </script>


    <!-- =========================================
         GLOBAL SCRIPT
    ========================================= -->

    

<script src="js/pro-enhancements.js"></script>
</body>
</html>
