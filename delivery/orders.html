<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Assigned Orders | Sei Mart</title>
<link rel="stylesheet" href="css/delivery.css">
</head>
<body data-delivery-page="orders">
<div class="delivery-layout">
  <aside class="delivery-sidebar">
    <div class="side-brand">Sei <span>Mart</span><small>Delivery Portal</small></div>
    <nav><a href="dashboard.html">▣ Dashboard</a><a class="active" href="orders.html">📦 Assigned Orders</a></nav>
    <button class="logout-btn" onclick="deliveryLogout()">↪ Logout</button>
  </aside>
  <main class="delivery-main">
    <header class="delivery-header"><div><h1>Assigned Orders</h1><p id="ordersSubtitle">Orders assigned to you</p></div><div class="staff-chip" id="staffChip"></div></header>
    <section class="panel">
      <div class="toolbar"><input id="orderSearch" type="search" placeholder="Search Order ID, customer, phone..."><select id="statusFilter"><option value="all">All statuses</option><option value="Processing">Processing</option><option value="Out for Delivery">Out for Delivery</option><option value="Delivered">Delivered</option></select></div>
      <div id="ordersTableWrap"></div>
    </section>
  </main>
</div>
<script src="js/delivery-common.js"></script><script src="js/delivery-orders.js"></script>
</body>
</html>
