<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sei Mart | Admin Login</title>


    <!-- =====================================================
         ADMIN LOGIN CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/admin-login.css"
    >


</head>


<body>


    <!-- =====================================================
         ADMIN LOGIN PAGE
    ====================================================== -->

    <div class="admin-login-page">


        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <div class="admin-login-card">


            <!-- LOGO -->

            <div class="admin-login-logo">

                <div class="admin-logo-mark">
                    S
                </div>

                <div class="admin-logo-text">
                    Sei Mart
                </div>

            </div>


            <!-- TITLE -->

            <div class="admin-login-heading">

                <h1>
                    Admin Login
                </h1>

                <p>
                    Authorized Admin / Staff login
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form
                id="adminLoginForm"
                class="admin-login-form"
            >


                <!-- EMAIL -->

                <div class="admin-form-group">

                    <label for="adminEmail">
                        Email Address
                    </label>

                    <input
                        type="text"
                        id="adminEmail"
                        placeholder="Email or staff username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="admin-form-group">

                    <label for="adminPassword">
                        Password
                    </label>


                    <div class="admin-password-wrapper">

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            id="toggleAdminPassword"
                            class="password-toggle"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->

                <div class="admin-login-options">


                    <label class="remember-admin">

                        <input
                            type="checkbox"
                            id="rememberAdmin"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <button
                        type="button"
                        id="forgotAdminPassword"
                        class="forgot-password"
                    >
                        Forgot Password?
                    </button>


                </div>


                <!-- ERROR -->

                <div
                    id="adminLoginError"
                    class="admin-login-error"
                    style="display:none;"
                ></div>


                <!-- LOGIN BUTTON -->

                <div class="admin-login-actions">

                    <button
                        type="submit"
                        class="admin-login-button"
                    >
                        Login
                    </button>

                    <a
                        href="../delivery/login.html"
                        class="delivery-login-button"
                    >
                        🚚 Delivery Login
                    </a>

                </div>


            </form>


            <!-- FOOTER -->

            <div class="admin-login-footer">

                <span>
                    Sei Mart Admin Panel
                </span>

            </div>


        </div>


    </div>


    <!-- =====================================================
         ADMIN LOGIN JS
    ====================================================== -->

    <script src="../js/security.js"></script>
    <script src="js/admin-login.js"></script>


</body>

</html>
