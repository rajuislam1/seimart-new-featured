<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commission Settings | Sei Mart Admin</title>
<script src="js/admin-auth.js"></script>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f3f6f4;color:#17231d;}
.top{background:#17231d;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.top a{color:#e8c65a;text-decoration:none;font-weight:600;}
.wrap{max-width:720px;margin:24px auto;padding:0 16px 40px;}
.card{background:#fff;border:1px solid #e3e9e4;border-radius:14px;padding:22px;}
label{display:block;margin:14px 0 6px;font-weight:600;font-size:13px;}
input,select{width:100%;padding:11px 12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;}
.btn{margin-top:16px;background:#3f6f5a;color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;}
.msg{display:none;margin-top:12px;padding:10px;background:#e9f6ed;color:#3f8c5a;border-radius:8px;font-weight:600;}
.hint{font-size:13px;color:#7b877f;line-height:1.5;}
.preview{margin-top:18px;padding:14px;background:#f5f7f5;border-radius:10px;font-size:14px;}
</style>
</head>
<body>
<div class="top">
  <strong>💰 Commission Settings</strong>
  <div><a href="../admin.html">← Admin</a> · <a href="sellers-manage.html">Sellers</a></div>
</div>
<div class="wrap">
  <div class="card">
    <h2 style="margin-top:0;">Platform commission</h2>
    <p class="hint">Frontend demo setting. When a seller sells a product, this % is reserved for Sei Mart. Seller earnings = sale − commission.</p>
    <label>Commission rate (%)</label>
    <input type="number" id="rate" min="0" max="100" step="0.5" value="10">
    <label>Status</label>
    <select id="status">
      <option value="active">Active</option>
      <option value="disabled">Disabled (0%)</option>
    </select>
    <label>Notes (optional)</label>
    <input type="text" id="notes" placeholder="e.g. Standard marketplace fee">
    <button type="button" class="btn" onclick="saveComm()">Save Settings</button>
    <div class="msg" id="msg">Saved.</div>
    <div class="preview" id="preview"></div>
  </div>
</div>
<script>
function getComm(){
  try { return JSON.parse(localStorage.getItem("seiMartCommission") || "null"); } catch(e) { return null; }
}
function load(){
  var c = getComm() || { rate: 10, status: "active", notes: "" };
  document.getElementById("rate").value = c.rate != null ? c.rate : 10;
  document.getElementById("status").value = c.status || "active";
  document.getElementById("notes").value = c.notes || "";
  updatePreview();
}
function updatePreview(){
  var rate = Number(document.getElementById("rate").value) || 0;
  var st = document.getElementById("status").value;
  if (st === "disabled") rate = 0;
  var sale = 1000;
  var fee = Math.round(sale * rate / 100);
  document.getElementById("preview").innerHTML =
    "<strong>Example:</strong> Product sale ৳"+sale.toLocaleString("en-BD") +
    " → Platform ৳"+fee+" ("+rate+"%) → Seller ৳"+(sale-fee).toLocaleString("en-BD");
}
function saveComm(){
  var rate = Number(document.getElementById("rate").value) || 0;
  var status = document.getElementById("status").value;
  var notes = document.getElementById("notes").value.trim();
  localStorage.setItem("seiMartCommission", JSON.stringify({
    rate: rate, status: status, notes: notes, updatedAt: new Date().toISOString()
  }));
  var msg = document.getElementById("msg");
  msg.style.display = "block";
  setTimeout(function(){ msg.style.display = "none"; }, 2000);
  updatePreview();
}
document.getElementById("rate").addEventListener("input", updatePreview);
document.getElementById("status").addEventListener("change", updatePreview);
load();
</script>
</body>
</html>
