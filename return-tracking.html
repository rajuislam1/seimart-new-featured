<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Return Tracking | Sei Mart</title>
<link rel="stylesheet" href="style.css">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f5f7f5;color:#17231d;}
.top{background:#fff;border-bottom:1px solid #e3e9e4;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.top a{color:#3f6f5a;font-weight:700;text-decoration:none;}
.wrap{max-width:800px;margin:24px auto 60px;padding:0 16px;}
.card{background:#fff;border:1px solid #e3e9e4;border-radius:14px;padding:18px;margin-bottom:14px;}
.badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:800;background:#eaf2ed;color:#3f6f5a;}
.timeline{border-left:3px solid #c5ddd0;margin:12px 0 0 8px;padding-left:16px;}
.timeline div{margin-bottom:12px;position:relative;}
.timeline div::before{content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:#3f6f5a;}
input{padding:10px;border-radius:8px;border:1px solid #ccc;}
button{padding:10px 14px;border:none;border-radius:8px;background:#3f6f5a;color:#fff;font-weight:700;cursor:pointer;}

@media (max-width:600px){
  .wrap{margin:16px auto 40px;padding:0 12px;}
  .card{padding:14px;}
  .top{padding:10px 12px;}
  input,button{min-height:44px;}
}
</style>
</head>
<body>
<div class="top">
  <a href="account.html">← My Account</a>
  <strong>Return Tracking</strong>
  <a href="index.html">Home</a>
</div>
<div class="wrap">
  <div class="card">
    <label style="font-weight:600;font-size:13px;">Return ID or Order ID</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
      <input type="text" id="q" placeholder="RT… or SM…" style="flex:1;min-width:180px;">
      <button type="button" onclick="track()">Track</button>
    </div>
  </div>
  <div id="result"></div>
  <div id="myList"></div>
</div>
<script>
function getReturns(){ try{return JSON.parse(localStorage.getItem("seiMartReturns")||"[]");}catch(e){return[];} }
function getUser(){ try{return JSON.parse(localStorage.getItem("seiMartUser")||"null");}catch(e){return null;} }
function esc(v){ return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function renderOne(r){
  var hist = (r.history||[]).slice().reverse();
  return '<div class="card">'+
    '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">'+
    '<div><strong>'+esc(r.id)+'</strong><br><small>Order '+esc(r.orderId)+'</small></div>'+
    '<span class="badge">'+esc(r.status)+'</span></div>'+
    '<p style="margin:10px 0;font-size:14px;color:#555;">'+esc(r.reason)+' — '+esc(r.details||"")+'</p>'+
    '<p style="font-size:13px;color:#7b877f;">'+esc(r.deliveryChargeNote||"")+'</p>'+
    '<h4 style="margin:12px 0 6px;">Progress</h4><div class="timeline">'+
    hist.map(function(h){
      return '<div><strong>'+esc(h.status)+'</strong> · <small>'+esc(h.label||h.at)+'</small>'+
        (h.note?'<div style="font-size:13px;color:#666;">'+esc(h.note)+'</div>':'')+'</div>';
    }).join("")+'</div></div>';
}

var lastTrackedId = "";

function track(){
  var q = (document.getElementById("q").value||"").trim().toLowerCase();
  var list = getReturns();
  var r = list.find(function(x){ return String(x.id).toLowerCase()===q || String(x.orderId).toLowerCase()===q; });
  var result = document.getElementById("result");
  if (r) {
    lastTrackedId = String(r.id);
    result.innerHTML = renderOne(r);
  } else if (q) {
    lastTrackedId = "";
    result.innerHTML = '<div class="card" style="color:#d9534f;font-weight:700;">No return found for this ID.</div>';
  } else {
    lastTrackedId = "";
    result.innerHTML = "";
  }
  listMine();
}

function listMine(){
  var user = getUser();
  var list = getReturns();
  if (user) {
    var email = (user.email||"").toLowerCase();
    var phone = (user.phone||"");
    list = list.filter(function(r){
      var c = r.customer||{};
      return (email && String(c.email||"").toLowerCase()===email) || (phone && String(c.phone||"")===phone);
    });
  }
  // Avoid duplicate: if a return is already shown in Track result, hide from list
  if (lastTrackedId) {
    list = list.filter(function(r){ return String(r.id) !== String(lastTrackedId); });
  }
  var el = document.getElementById("myList");
  if (!list.length) {
    el.innerHTML = lastTrackedId
      ? ""
      : '<div class="card" style="color:#999;">No returns linked to this account yet.</div>';
    return;
  }
  el.innerHTML = '<h3 style="margin:8px 0 12px;">Your other returns</h3>' + list.map(renderOne).join("");
}

var params = new URLSearchParams(location.search);
var id = params.get("id") || params.get("order") || "";
if (id) {
  document.getElementById("q").value = id;
  track();
} else {
  listMine();
}
</script>
</body>
</html>
